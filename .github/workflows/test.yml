name: test

# Everything that runs without a head unit's files: the Java host tests, the
# energy-model generator, the EV log tools, and the package install/uninstall
# scripts on made-up files for two cars (SYNTH=1).
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q protobuf-compiler zip unzip
          python -m pip install -q bsdiff4==1.3.1 capstone
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-19" "build-tools;34.0.0" > /dev/null
          cc -DHOST -O2 -o "$RUNNER_TEMP/lpatch-host" third_party/lpatch/lpatch.c

      - name: Energy model is reproducible
        run: |
          mkdir -p dist
          python tools/build_ioniq5_model.py
          git diff --exit-code gpm-ev/src/com/google/android/projection/protocol/EvModelTemplate.java

      - name: Java host tests
        run: sh gpm-ev/test/run.sh

      - name: GPM classes compile and dex for API 19
        run: |
          P=com/google/android/projection/protocol
          mkdir -p "$RUNNER_TEMP/c" "$RUNNER_TEMP/d"
          cd gpm-ev
          javac -nowarn -source 8 -target 8 \
            -bootclasspath "$ANDROID_HOME/platforms/android-19/android.jar" \
            -d "$RUNNER_TEMP/c" src/$P/*.java stubs/$P/SensorSource.java stubs/com/hkmc/cluster/*.java
          "$ANDROID_HOME/build-tools/34.0.0/d8" --min-api 19 --output "$RUNNER_TEMP/d" \
            $(ls "$RUNNER_TEMP"/c/$P/Ev*.class "$RUNNER_TEMP"/c/$P/NavProto*.class "$RUNNER_TEMP"/c/$P/Precond*.class)

      - name: EV log tools
        run: PY=python sh tools/test_evlog.sh

      - name: Package scripts (synthetic two-car package)
        run: |
          SYNTH=1 PY=python LPATCH="$RUNNER_TEMP/lpatch-host" \
            LPATCH_HOST="$RUNNER_TEMP/lpatch-host" bash tools/test_package.sh
