name: EV log submission
description: Contribute cleaned EV logs (driving and charging) to improve the energy model.
title: "EV logs: "
labels: ["ev-log"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Attach the `egmp-*.csv` files from the `egmp-aa-ev-logs` folder on your USB drive as they are. The head unit only records technical data (no location, no full VIN, no times of day).

        **This issue and its attachments are public.** Don't write anything here you wouldn't post publicly (no full VIN, no places).
  - type: dropdown
    id: car
    attributes:
      label: Car model
      options:
        - Ioniq 5
        - Ioniq 6
        - EV6
        - EV9
        - GV60
        - other
    validations:
      required: true
  - type: input
    id: model_year
    attributes:
      label: Model year
      placeholder: "2022"
    validations:
      required: true
  - type: input
    id: product
    attributes:
      label: Head unit software
      description: The `product` line at the top of a log file, e.g. `NEEV.USA.0000.V015.012.260507`.
    validations:
      required: true
  - type: textarea
    id: battery
    attributes:
      label: Battery note (optional)
      description: Anything known about the battery, e.g. mileage, state of health from a scan tool, a pack replacement.
  - type: textarea
    id: conditions
    attributes:
      label: Conditions (optional)
      description: Roughly what the drives and charging sessions were like (highway, city, towing, roof box, winter tyres, cabin heat, DC or AC charging). No places or addresses.
  - type: textarea
    id: files
    attributes:
      label: Log files
      description: Drag the cleaned `.csv` files into this box, or click the attach bar under it. Zip them first if there are many.
      placeholder: Drop the cleaned egmp-*.csv files here.
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: The attached files are unedited logs from the head unit, and I'm fine with them being public.
          required: true
